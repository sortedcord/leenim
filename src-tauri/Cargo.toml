[package]
name = "leenim"
version = "0.1.0"
description = "A GUI editor for 3B1B's Manim Library!"
authors = ["sortedcord"]
edition = "2021"


[lib]
name = "leenim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
